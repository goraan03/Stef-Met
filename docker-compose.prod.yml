version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stefmat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stefmat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stefmat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stefmat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (NestJS) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: stefmat-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/stefmat?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-dragoste69@gmail.com}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stefmat-network
    ports:
      - "3001:3000"   # host:container — dostupno za Caddy via host.docker.internal:3001

  # ─── Frontend (nginx SPA) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://stefmat.net/api}
    container_name: stefmat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - stefmat-network
    ports:
      - "8081:80"     # host:container — dostupno za Caddy via host.docker.internal:8081

volumes:
  postgres_data:
  uploads_data:

networks:
  stefmat-network:
    driver: bridge
