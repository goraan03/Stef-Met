# HTTP — redirect all to HTTPS
server {
    listen 80;
    server_name stefmat.net www.stefmat.net;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://stefmat.net$request_uri;
    }
}

# HTTPS — main server
server {
    listen 443 ssl;
    server_name stefmat.net www.stefmat.net;

    ssl_certificate     /etc/letsencrypt/live/stefmat.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stefmat.net/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirect www to non-www
    if ($host = www.stefmat.net) {
        return 301 https://stefmat.net$request_uri;
    }

    # ── API (backend) ────────────────────────────────────────
    location /api {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # File upload support
        client_max_body_size 20M;
    }

    # ── Uploaded files ───────────────────────────────────────
    location /uploads {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;

        # Cache uploaded images
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Frontend (SPA) ───────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
